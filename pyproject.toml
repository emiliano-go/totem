[project]
name = "totem-mcp"
version = "0.6.0"
description = "Persistent memory layer for engineering agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "mcp>=1.0,<2.0",
    "pyturso>=0.7.2",
]

[project.scripts]
totem = "totem_mcp.cli:main"
totem-mcp = "totem_mcp.cli:mcp_main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = {"totem_mcp" = ["agent_config/*"]}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
